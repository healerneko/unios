name: UniOS Linux Live checks

on:
  push:
    branches:
      - main
      - teste-conexao-403-2
    paths:
      - "build-linux-live.sh"
      - "linux-live/**"
      - ".github/workflows/linux-live-check.yml"
  pull_request:
    paths:
      - "build-linux-live.sh"
      - "linux-live/**"
      - ".github/workflows/linux-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Validate scripts and GRUB configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes busybox-static grub-common shellcheck

      - name: Check Bash build script syntax
        run: bash -n build-linux-live.sh

      - name: Check BusyBox init syntax
        run: busybox ash -n linux-live/init

      - name: Check DHCP hook syntax
        run: busybox ash -n linux-live/udhcpc.script

      - name: Lint build script for serious issues
        run: shellcheck --severity=error build-linux-live.sh

      - name: Validate GRUB configuration
        run: |
          sed 's/@KERNEL@/vmlinuz-cachyos-test/g' linux-live/grub.cfg > /tmp/unios-grub.cfg
          grub-script-check /tmp/unios-grub.cfg
          grep -q 'rdinit=/init' /tmp/unios-grub.cfg
          grep -q 'initrd /boot/unios-initramfs.cpio.gz' /tmp/unios-grub.cfg

      - name: Verify initramfs build safeguards
        run: |
          grep -q 'gzip -t' build-linux-live.sh
          grep -q "cpio -it" build-linux-live.sh
          grep -q "grep -qx './init'" build-linux-live.sh
          echo "Initramfs integrity checks are present."
