set timeout=3
set default=0
set gfxmode=800x600x32
set gfxpayload=keep
search --no-floppy --file --set=root /boot/unios-initramfs.cpio.gz
insmod all_video
insmod gfxterm
insmod serial
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial gfxterm

menuentry "UniOS Linux Live (CachyOS kernel)" {
    linux /boot/vmlinuz-cachyos-7.3.3-1-cachyos rdinit=/init rw loglevel=5 console=tty0 console=ttyS0,115200n8
    initrd /boot/unios-initramfs.cpio.gz
}
